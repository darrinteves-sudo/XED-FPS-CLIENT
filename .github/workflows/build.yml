
name: Build XED FPS Client

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Extract source ZIP
        run: |
          unzip -q XED_FPS_Client_Source_v1_1_21_11.zip -d source
          test -f source/XED_FPS_Client_Source/build.gradle

      - name: Build Minecraft mod
        run: gradle -p source/XED_FPS_Client_Source build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: XED-FPS-Client-1.21.11
          path: |
            source/XED_FPS_Client_Source/build/libs/*.jar
            !source/XED_FPS_Client_Source/build/libs/*-sources.jar
            !source/XED_FPS_Client_Source/build/libs/*-dev.jar
          if-no-files-found: error
