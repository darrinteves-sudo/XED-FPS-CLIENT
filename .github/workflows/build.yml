
name: Build XED FPS Client (New)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Extract source ZIP
        shell: bash
        run: |
          mkdir -p source
          ZIP="$(find . -maxdepth 1 -type f -iname 'XED_FPS_Client_Source*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Could not find XED_FPS_Client_Source*.zip in the repository root."
            exit 1
          fi
          unzip -q "$ZIP" -d source

      - name: Build Minecraft mod
        shell: bash
        run: |
          PROJECT="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "No build.gradle or build.gradle.kts found inside the source ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "Building project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" --no-daemon build

      - name: Collect mod JAR
        shell: bash
        run: |
          mkdir -p dist
          find source -type f -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          if ! find dist -maxdepth 1 -type f -name '*.jar' -print -quit | grep -q .; then
            echo "Build completed but no distributable JAR was found."
            exit 1
          fi
          ls -lh dist

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: XED-FPS-Client-JAR
          path: dist/*.jar
          if-no-files-found: error
