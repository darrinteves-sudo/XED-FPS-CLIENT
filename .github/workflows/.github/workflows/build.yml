
name: Build XED FPS Client

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q XED_FPS_Client_Source_v1_1_21_11.zip -d source

      - name: Build Minecraft mod
        run: |
          SETTINGS_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            BUILD_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [ -z "$BUILD_FILE" ]; then
              echo "Could not find Gradle project"
              exit 1
            fi
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi
          gradle -p "$PROJECT_DIR" build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: XED-FPS-Client-1.21.11
          path: source/**/build/libs/*.jar
          if-no-files-found: error
