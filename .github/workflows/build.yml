
name: Build XED FPS Client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract source ZIP
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -name 'XED_FPS_Client_Source*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d source

      - name: Build Minecraft mod
        run: |
          PROJECT=$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          DIR=$(dirname "$PROJECT")
          if [ ! -f "$DIR/gradlew" ]; then
            echo "Gradle wrapper missing from source ZIP"
            exit 1
          fi
          chmod +x "$DIR/gradlew"
          "$DIR/gradlew" --no-daemon build

      - name: Prepare mod JAR
        run: |
          mkdir -p dist
          find source -path '*/build/libs/*.jar' \
            -type f ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -name '*.jar' -print -quit)"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: XED-FPS-Client
          path: dist/*.jar
          if-no-files-found: error
